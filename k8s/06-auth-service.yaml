apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: retailstore

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service

        image: akashjagdale177/auth-service:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 5001

        envFrom:
        - configMapRef:
            name: retail-config

---
apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: retailstore

spec:

  selector:
    app: auth-service

  ports:

  - port: 5001
    targetPort: 5001

  type: ClusterIP
